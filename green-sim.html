        function findHeaderEnd(bytes) {
            var marker = [101,110,100,95,104,101,97,100,101,114];
            var limit = Math.min(bytes.length, 2000000);
            for (var i = 0; i < limit; i++) {
                var ok = true;
                for (var k = 0; k < marker.length; k++) { if (bytes[i + k] !== marker[k]) { ok = false; break; } }
                if (!ok) continue;
                var j = i + marker.length;
                if (bytes[j] === 13) j++;
                if (bytes[j] === 10) j++;
                else if (bytes[j] !== 10 && bytes[j] !== undefined) continue;
                return j;
            }
            return -1;
        }

        // Returns {x, y, z} Float32Arrays (decimated to <= 300k points).
        function parsePLYPoints(arrayBuffer) {
            var bytes = new Uint8Array(arrayBuffer);
            var headerEnd = findHeaderEnd(bytes);
            if (headerEnd < 0) throw new Error('Not a PLY file (no end_header)');
            var header = new TextDecoder('utf-8').decode(bytes.subarray(0, headerEnd));
            var lines = header.split(/\r?\n/);
            var format = 'ascii', vertexCount = 0, inVertex = false, props = [];
            for (var li = 0; li < lines.length; li++) {
                var line = lines[li].trim();
                if (!line || line.indexOf('comment') === 0) continue;
                if (line.indexOf('format ') === 0) format = line.split(/\s+/)[1];
                else if (line.indexOf('element ') === 0) {
                    var ep = line.split(/\s+/);
                    inVertex = ep[1] === 'vertex';
                    if (inVertex) vertexCount = parseInt(ep[2], 10) || 0;
                } else if (inVertex && line.indexOf('property ') === 0) {
                    var pp = line.split(/\s+/);
                    if (pp[1] === 'list') throw new Error('This PLY is a mesh, not a point cloud. Export Point Cloud, then PLY.');
                    props.push({ type: pp[1], name: pp[2] });
                }
            }
            if (!vertexCount) throw new Error('PLY has no vertices');
            var xi = -1, yi = -1, zi = -1;
            for (var pi = 0; pi < props.length; pi++) {
                if (props[pi].name === 'x') xi = pi;
                if (props[pi].name === 'y') yi = pi;
                if (props[pi].name === 'z') zi = pi;
            }
            if (xi < 0 || yi < 0 || zi < 0) throw new Error('PLY has no x y z');
            var offsets = [], stride = 0;
            for (var ti = 0; ti < props.length; ti++) {
                var sz = PLY_TYPES[props[ti].type];
                if (!sz) throw new Error('Unsupported PLY property type: ' + props[ti].type);
                offsets.push(stride); stride += sz;
            }
            var MAX_POINTS = 300000;
            var step = Math.max(1, Math.ceil(vertexCount / MAX_POINTS));
            var cap = Math.ceil(vertexCount / step) + 1;
            var X = new Float32Array(cap), Y = new Float32Array(cap), Z = new Float32Array(cap), n = 0;
            function push(x, y, z) { if (isFinite(x) && isFinite(y) && isFinite(z) && n < cap) { X[n] = x; Y[n] = y; Z[n] = z; n++; } }
            if (format === 'ascii') {
                var text = new TextDecoder('utf-8').decode(bytes.subarray(headerEnd));
                var pos = 0, seen = 0, L = text.length;
                while (pos < L && seen < vertexCount) {
                    var nl = text.indexOf('\n', pos); if (nl < 0) nl = L;
                    if (seen % step === 0) {
                        var parts = text.substring(pos, nl).trim().split(/\s+/);
                        if (parts.length >= props.length) push(+parts[xi], +parts[yi], +parts[zi]);
                    }
                    seen++; pos = nl + 1;
                }
            } else if (format === 'binary_little_endian' || format === 'binary_big_endian') {
                var view = new DataView(arrayBuffer, headerEnd);
                var little = format === 'binary_little_endian';
                function readNum(type, off) {
                    if (type === 'float' || type === 'float32') return view.getFloat32(off, little);
                    if (type === 'double' || type === 'float64') return view.getFloat64(off, little);
                    if (type === 'char' || type === 'int8') return view.getInt8(off);
                    if (type === 'uchar' || type === 'uint8') return view.getUint8(off);
                    if (type === 'short' || type === 'int16') return view.getInt16(off, little);
                    if (type === 'ushort' || type === 'uint16') return view.getUint16(off, little);
                    if (type === 'int' || type === 'int32') return view.getInt32(off, little);
                    if (type === 'uint' || type === 'uint32') return view.getUint32(off, little);
                    return NaN;
                }
                var avail = Math.min(vertexCount, Math.floor(view.byteLength / stride));
                for (var vi = 0; vi < avail; vi += step) {
                    var base = vi * stride;
                    push(readNum(props[xi].type, base + offsets[xi]), readNum(props[yi].type, base + offsets[yi]), readNum(props[zi].type, base + offsets[zi]));
                }
            } else throw new Error('Unsupported PLY format: ' + format);
            return { x: X.subarray(0, n), y: Y.subarray(0, n), z: Z.subarray(0, n), total: vertexCount };
        }

        function pickUpAxis(P) {
            // Dominant plane by RANSAC, snapped to the closest axis (ARKit/LiDARo = Y up).
            var s = 12345 >>> 0;
            function rnd() { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
            var n = P.x.length, best = [0, 1, 0], bestCount = -1, sample = [];
            for (var k = 0; k < Math.min(n, 3000); k++) sample.push(Math.floor(rnd() * n));
            for (var it = 0; it < 200; it++) {
                var a = Math.floor(rnd() * n), b = Math.floor(rnd() * n), c = Math.floor(rnd() * n);
                var ux = P.x[b] - P.x[a], uy = P.y[b] - P.y[a], uz = P.z[b] - P.z[a];
                var vx = P.x[c] - P.x[a], vy = P.y[c] - P.y[a], vz = P.z[c] - P.z[a];
                var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
                var len = Math.hypot(nx, ny, nz); if (len < 1e-9) continue;
                nx /= len; ny /= len; nz /= len;
                var d = -(nx * P.x[a] + ny * P.y[a] + nz * P.z[a]), cnt = 0;
                for (var q = 0; q < sample.length; q++) { var i = sample[q]; if (Math.abs(nx * P.x[i] + ny * P.y[i] + nz * P.z[i] + d) < 0.03) cnt++; }
                if (cnt > bestCount) { bestCount = cnt; best = [nx, ny, nz]; }
            }
            var comps = best.map(Math.abs), up = 1;
            if (comps[2] > comps[up]) up = 2;
            if (comps[0] > comps[up]) up = 0;
            return up;
        }

        function pctl(sortedArr, p) {
            if (!sortedArr.length) return 0;
            var idx = (sortedArr.length - 1) * p, lo = Math.floor(idx), hi = Math.ceil(idx);
            return sortedArr[lo] + (sortedArr[hi] - sortedArr[lo]) * (idx - lo);
        }

        function cellMedians(U, V, H, keep, ox, oz, cs, cols, rows, minCount) {
            var n = U.length, ncell = cols * rows;
            var counts = new Int32Array(ncell + 1);
            var cellOf = new Int32Array(n).fill(-1);
            for (var i = 0; i < n; i++) {
                if (keep && !keep[i]) continue;
                var c = Math.floor((U[i] - ox) / cs), r = Math.floor((V[i] - oz) / cs);
                if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
                cellOf[i] = r * cols + c; counts[r * cols + c + 1]++;
            }
            for (var k = 0; k < ncell; k++) counts[k + 1] += counts[k];
            var fillPos = counts.slice(0, ncell), vals = new Float32Array(counts[ncell]);
            for (var i2 = 0; i2 < n; i2++) if (cellOf[i2] >= 0) vals[fillPos[cellOf[i2]]++] = H[i2];
            var out = new Float32Array(ncell).fill(NaN);
            for (var k2 = 0; k2 < ncell; k2++) {
                var a = counts[k2], b = counts[k2 + 1];
                if (b - a < minCount) continue;
                var arr = Array.prototype.slice.call(vals.subarray(a, b)).sort(function (p, q) { return p - q; });
                out[k2] = pctl(arr, 0.5);
            }
            return out;
        }

        function pointsToHeightmap(P, name) {
            var up = pickUpAxis(P);
            var A = [P.x, P.y, P.z];
            // Screen axes: Y-up -> (x, z); Z-up -> (x, -y); X-up -> (y, z)
            var n = P.x.length;
            var U = up === 0 ? A[1] : A[0];
            var V = new Float32Array(n), H = A[up];
            for (var i = 0; i < n; i++) V[i] = up === 2 ? -A[1][i] : A[2][i];
            var us = Array.prototype.slice.call(U).sort(function (a, b) { return a - b; });
            var vs = Array.prototype.slice.call(V).sort(function (a, b) { return a - b; });
            var u0 = pctl(us, 0.002), u1 = pctl(us, 0.998), v0 = pctl(vs, 0.002), v1 = pctl(vs, 0.998);
            var cs = Math.max(0.1, Math.max(u1 - u0, v1 - v0) / 160);
            var ox = Math.floor(u0 / cs) * cs, oz = Math.floor(v0 / cs) * cs;
            var cols = Math.ceil((u1 - ox) / cs) + 1, rows = Math.ceil((v1 - oz) / cs) + 1;
            // Coarse 40 cm surface, then drop points > 8 cm off it (people, bag, flagstick, noise).
            var C = Math.max(0.4, cs * 4), ccols = Math.ceil((u1 - ox) / C) + 1, crows = Math.ceil((v1 - oz) / C) + 1;
            var coarse = cellMedians(U, V, H, null, ox, oz, C, ccols, crows, 8);
            var keep = new Uint8Array(n);
            var dropped = 0;
            for (var i3 = 0; i3 < n; i3++) {
                var cc = Math.floor((U[i3] - ox) / C), cr = Math.floor((V[i3] - oz) / C);
                var ref = (cc >= 0 && cr >= 0 && cc < ccols && cr < crows) ? coarse[cr * ccols + cc] : NaN;
                if (isFinite(ref) && Math.abs(H[i3] - ref) < 0.08) keep[i3] = 1; else dropped++;
            }
            var G = cellMedians(U, V, H, keep, ox, oz, cs, cols, rows, 3);
            // Fill small gaps: a cell with >= 5 of 8 measured neighbours gets their mean.
            for (var it = 0; it < 6; it++) {
                var add = [];
                for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
                    if (isFinite(G[r * cols + c])) continue;
                    var s = 0, m = 0;
                    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
                        if (!dr && !dc) continue;
                        var rr = r + dr, c2 = c + dc;
                        if (rr < 0 || c2 < 0 || rr >= rows || c2 >= cols) continue;
                        var vv = G[rr * cols + c2]; if (isFinite(vv)) { s += vv; m++; }
                    }
                    if (m >= 5) add.push([r * cols + c, s / m]);
                }
                if (!add.length) break;
                add.forEach(function (e) { G[e[0]] = e[1]; });
            }
            // Mask: measured cells, minus specks under 1 m^2.
            var ncell = cols * rows, mask = new Uint8Array(ncell), lab = new Int32Array(ncell), minCells = Math.round(1 / (cs * cs));
            for (var k = 0; k < ncell; k++) mask[k] = isFinite(G[k]) ? 1 : 0;
            var cur = 0;
            for (var k2 = 0; k2 < ncell; k2++) {
                if (!mask[k2] || lab[k2]) continue;
                cur++; var stack = [k2], comp = []; lab[k2] = cur;
                while (stack.length) {
                    var q = stack.pop(); comp.push(q);
                    var qr = (q / cols) | 0, qc = q - qr * cols;
                    var nb = [qr > 0 ? q - cols : -1, qr < rows - 1 ? q + cols : -1, qc > 0 ? q - 1 : -1, qc < cols - 1 ? q + 1 : -1];
                    for (var t = 0; t < 4; t++) { var j = nb[t]; if (j >= 0 && mask[j] && !lab[j]) { lab[j] = cur; stack.push(j); } }
                }
                if (comp.length < minCells) comp.forEach(function (q2) { mask[q2] = 0; });
            }
            // Masked Gaussian smoothing, sigma 1.5 cells.
            var sig = 1.5, R = 4, ker = [];
            for (var d = -R; d <= R; d++) ker.push(Math.exp(-0.5 * (d / sig) * (d / sig)));
            function blur(src, w, horiz) {
                var out = new Float32Array(ncell), wout = new Float32Array(ncell);
                for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
                    var s = 0, ws = 0;
                    for (var d = -R; d <= R; d++) {
                        var rr = horiz ? r : r + d, c2 = horiz ? c + d : c;
                        if (rr < 0 || c2 < 0 || rr >= rows || c2 >= cols) continue;
                        var kk = ker[d + R]; s += src[rr * cols + c2] * kk; ws += w[rr * cols + c2] * kk;
                    }
                    out[r * cols + c] = s; wout[r * cols + c] = ws;
                }
                return [out, wout];
            }
            var A0 = new Float32Array(ncell), W0 = new Float32Array(ncell);
            for (var k3 = 0; k3 < ncell; k3++) if (mask[k3]) { A0[k3] = G[k3]; W0[k3] = 1; }
            var h1 = blur(A0, W0, true), h2 = blur(h1[0], h1[1], false);
            var hmin = Infinity;
            var Hs = new Float32Array(ncell);
            for (var k4 = 0; k4 < ncell; k4++) {
                Hs[k4] = mask[k4] && h2[1][k4] > 1e-6 ? h2[0][k4] / h2[1][k4] : NaN;
                if (mask[k4] && isFinite(Hs[k4])) hmin = Math.min(hmin, Hs[k4]); else mask[k4] = 0;
            }
            var heights = [], maskRows = [];
            for (var k5 = 0; k5 < ncell; k5++) heights.push(isFinite(Hs[k5]) ? Math.round((Hs[k5] - hmin) * 1000) : null);
            for (var r2 = 0; r2 < rows; r2++) {
                var srow = '';
                for (var c3 = 0; c3 < cols; c3++) srow += mask[r2 * cols + c3] ? '1' : '0';
                maskRows.push(srow);
            }
            return {
                format: 'puttguide-heightmap', version: 1, name: name || 'Loaded scan',
                cellSize: cs, cols: cols, rows: rows, origin: { x: ox, z: oz }, heightUnits: 'mm',
                heights: heights, mask: maskRows, upAxis: 'xyz'.charAt(up), droppedPoints: dropped, totalPoints: P.total
            };
        }

        function loadHeightmapObject(json, id) {
            if (json && json.heightData && !json.heights) json = checkerJsonToHeightmap(json);
            if (!json || !json.heights || !json.cols || !json.rows) throw new Error('Not a PuttGuide height map');
            const g = makeGridGreen(json, id);
            g.fromChecker = !!json.lowCoverage;
            const existing = realGreens.findIndex(r => r.id === g.id);
            if (existing >= 0) realGreens[existing] = g; else realGreens.push(g);
            return g;
        }

        function handleScanFile(file) {
            if (!file) return;
            showToast('Reading ' + file.name + '…', 0);
            const reader = new FileReader();
            reader.onerror = () => showToast('Could not read that file', 3500);
            reader.onload = () => {
                setTimeout(() => {
                    try {
                        const buf = reader.result;
                        const head = new TextDecoder('utf-8').decode(new Uint8Array(buf, 0, Math.min(16, buf.byteLength))).trim();
                        let g, hm;
                        let shortName = file.name.replace(/\.[^.]+$/, '');
                        if (shortName.length > 18) shortName = shortName.slice(0, 8) + '…' + shortName.slice(-6);
                        if (head.indexOf('ply') === 0) {
                            const P = parsePLYPoints(buf);
                            if (P.x.length < 500) throw new Error('Too few points in this scan');
                            hm = pointsToHeightmap(P, 'Scan: ' + shortName);
                            g = loadHeightmapObject(hm, LAST_SCAN_ID);
                        } else {
                            const json = JSON.parse(new TextDecoder('utf-8').decode(new Uint8Array(buf)));
                            if (!json.name) json.name = 'Scan: ' + shortName;
                            hm = json;
                            g = loadHeightmapObject(json, LAST_SCAN_ID);
                        }
                        rememberScan(hm, g);
                        selectGreen(g);
                        showToast('Loaded ' + g.name, 2500);
                    } catch (err) {
                        showToast('Could not load: ' + err.message, 5000);
                    }
                }, 30);
            };
            reader.readAsArrayBuffer(file);
        }

        // ============================================
        // SHARED WITH THE AR VIEW (localStorage)
        // ============================================
        // The last loaded scan and the current putt are remembered so ar-view.html (and the next
        // visit here) can use them without loading the file again.
        const LAST_SCAN_ID = 'last-scan', LAST_SCAN_KEY = 'puttguide.lastScan', SIM_STATE_KEY = 'puttguide.simState';
        let lastScanStamp = null;
        function rememberScan(hm, g) {
            lastScanStamp = Date.now();
            try { localStorage.setItem(LAST_SCAN_KEY, JSON.stringify({ stamp: lastScanStamp, name: g.name, json: hm })); }
            catch (_) { showToast('Loaded (too big to remember for the AR view)', 3000); }
        }
        function restoreLastScan() {
            try {
                const rec = JSON.parse(localStorage.getItem(LAST_SCAN_KEY) || 'null');
                if (!rec || !rec.json) return null;
                const g = loadHeightmapObject(rec.json, LAST_SCAN_ID);
                if (rec.name) g.name = rec.name;
                lastScanStamp = rec.stamp || null;
                return g;
            } catch (_) { return null; }
        }
        function saveSimState() {
            try {
                localStorage.setItem(SIM_STATE_KEY, JSON.stringify({
                    greenId: selectedPreset.id, scanStamp: selectedPreset.id === LAST_SCAN_ID ? lastScanStamp : null,
                    ball: ballMarker, hole: holeMarker, power: puttPower, stimp: stimp, t: Date.now()
                }));
            } catch (_) {}
        }
        function arViewHref() {
            const q = new URLSearchParams();
            q.set('green', selectedPreset.id);
            if (ballMarker && holeMarker) {
                q.set('bx', ballMarker.x.toFixed(3)); q.set('bz', ballMarker.z.toFixed(3));
                q.set('hx', holeMarker.x.toFixed(3)); q.set('hz', holeMarker.z.toFixed(3));
            }
            q.set('p', String(puttPower)); q.set('s', String(stimp));
            return 'ar-view.html?' + q.toString();
        }
        // ?green=<id>&bx=&bz=&hx=&hz=&p=&s= (links back from the AR view)
        function applyUrlState() {
            const q = new URLSearchParams(window.location.search);
            const n = (k) => parseFloat(q.get(k));
            if (isFinite(n('p'))) { puttPower = Math.max(0, Math.min(100, Math.round(n('p')))); document.getElementById('power-slider').value = puttPower; }
            if (isFinite(n('s'))) { stimp = Math.max(6, Math.min(14, n('s'))); document.getElementById('stimp-slider').value = stimp; }
            if ([n('bx'), n('bz'), n('hx'), n('hz')].every(isFinite)) {
                const b = { x: n('bx'), z: n('bz') }, h = { x: n('hx'), z: n('hz') };
                if (isOnGreen(b.x, b.z) && isOnGreen(h.x, h.z)) { ballMarker = b; holeMarker = h; if (selectedPreset.kind === 'grid') zoomToPutt(); }
            }
            updateUI();
        }

        // ============================================
        // UI UPDATES
        // ============================================

        let toastTimer = null;
        function showToast(msg, ms) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            if (toastTimer) clearTimeout(toastTimer);
            if (ms) toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
        }

        function fallWords(gx, gz) {
            // Downhill direction = -gradient. Screen: +x right, +z toward the bottom (toward where the scan started).
            const dx = -gx, dz = -gz;
            const parts = [];
            if (Math.abs(dx) > 0.35 * Math.hypot(dx, dz)) parts.push(dx > 0 ? 'right' : 'left');
            if (Math.abs(dz) > 0.35 * Math.hypot(dx, dz)) parts.push(dz > 0 ? 'toward the bottom' : 'toward the top');
            return parts.join(' and ');
        }

        function updateGreenInfo() {
            const el = document.getElementById('green-info');
            const disc = document.getElementById('disclaimer');
            const g = selectedPreset;
            if (g.kind === 'grid') {
                const s = g.stats;
                let txt = `<b>${g.name}</b><br>${s.areaM2.toFixed(0)} m² measured · ${(s.rangeM * 100).toFixed(0)} cm high-to-low · ` +
                    `typical slope ${(s.medianSlope * 100).toFixed(1)}% · falls ${fallWords(s.meanGx, s.meanGz)} overall.`;
                if (s.lowM2 > 1) txt += `<br>Faint hatching = ${s.lowM2.toFixed(0)} m² where the scan doubled up; heights there are ±4 cm.`;
                if (g.fromChecker) txt += `<br>Checker height maps are coarse and have no off-green mask; the PLY file gives a better map.`;
                el.innerHTML = txt;
                disc.innerHTML = '<strong>📡 Measured green:</strong> heights from your LiDAR scan (10 cm grid, lightly smoothed, real tilt kept). ' +
                    'Top of the screen is the direction you faced when you started scanning. Putts stop at the edge of the scanned area. ' +
                    'Physics: rolling ball, 5/7 g slope pull, friction from the Stimp setting.';
            } else {
                el.innerHTML = '';
                disc.innerHTML = '<strong>⚠️ Simulated Green:</strong> This is a VIDEO GAME simulation with synthetic contours. Not measured from real greens. ' +
                    'Putt physics: rolling ball, 5/7 g slope pull, friction from the Stimp setting. For practice visualization only.';
            }
            document.getElementById('header-badge').textContent = g.kind === 'grid' ? 'Real scan' : '3D Contour View';
        }

        function updateUI() {
            const hasMarkers = holeMarker && ballMarker;
            document.getElementById('distance-section').style.display = hasMarkers ? 'block' : 'none';
            const powerFraction = puttPower / 100;
            let puttType = 'Soft';
            if (powerFraction > 0.67) puttType = 'Hard';
            else if (powerFraction > 0.33) puttType = 'Medium';
            const sol = getSolution();
            if (hasMarkers) {
                const dist = distance(ballMarker, holeMarker);
                document.getElementById('distance-value').textContent = dist.toFixed(1) + 'm';
                const dh = (getHeight(holeMarker.x, holeMarker.z) - getHeight(ballMarker.x, ballMarker.z)) * 100;
                const hill = Math.abs(dh) < 1 ? 'level' : (dh > 0 ? `${dh.toFixed(0)} cm uphill` : `${(-dh).toFixed(0)} cm downhill`);
                document.getElementById('info-overlay').textContent =
                    `${dist.toFixed(1)}m · ${hill} · ${puttType}` + (sol && !sol.missed ? ` (${sol.v0.toFixed(1)} m/s)` : '');
            } else {
                document.getElementById('info-overlay').textContent = placementMode ? `Tap the green to place the ${placementMode}` : 'Tap 🚩 Hole or ⚪ Ball, then tap the green';
            }
            document.getElementById('power-value').textContent = puttPower + '%';
            const pace = paceForPower(puttPower);
            document.getElementById('power-label').textContent = `${puttType} · rolls ~${pace < 0.15 ? 'to the cup' : pace.toFixed(1) + 'm past'}`;
            document.getElementById('stimp-value').textContent = stimp.toFixed(stimp % 1 ? 1 : 0);
            document.getElementById('toggle-contours-btn').textContent = showContours ? 'Hide Contours' : 'Show Contours';
            document.getElementById('toggle-line-btn').textContent = showLine ? 'Hide Line' : 'Show Line';
            saveSimState();
            render();
        }

        // Coalesce slider drags into one solve per frame (keeps iPhone responsive).
        let uiPending = false;
        function scheduleUI() {
            if (uiPending) return;
            uiPending = true;
            (window.requestAnimationFrame || setTimeout)(() => { uiPending = false; updateUI(); });
        }

        function defaultMarkersFor(g) {
            // A first putt to look at on the real green: sidehill, in the cleanly scanned part.
            if (g.id === 'real-green-1') return { ball: { x: 0.0, z: 0.4 }, hole: { x: 0.4, z: -2.0 } };
            // A newly loaded scan: LiDARo keeps where the scan started as (0,0), facing up the screen.
            if (g.id === LAST_SCAN_ID) return { ball: { x: 0.0, z: 0.0 }, hole: { x: 0.0, z: -2.5 } };
            return null;
        }

        function selectGreen(g) {
            selectedPreset = g;
            resetView();
            bgCacheKey = '';
            lastSolutionKey = '';
            if (g.kind === 'grid') {
                const okBall = ballMarker && isOnGreen(ballMarker.x, ballMarker.z);
                const okHole = holeMarker && isOnGreen(holeMarker.x, holeMarker.z);
                if (!okBall || !okHole) {
                    const d = defaultMarkersFor(g);
                    ballMarker = d && isOnGreen(d.ball.x, d.ball.z) ? d.ball : null;
                    holeMarker = d && isOnGreen(d.hole.x, d.hole.z) ? d.hole : null;
                }
            } else {
                const b = greenBounds();
                const inside = (m) => m && m.x > b.x0 && m.x < b.x1 && m.z > b.z0 && m.z < b.z1;
                if (!inside(ballMarker)) ballMarker = null;
                if (!inside(holeMarker)) holeMarker = null;
            }
            if (g.kind === 'grid') zoomToPutt();
            populatePresets();
            updateGreenInfo();
            updateUI();
        }

        function populatePresets() {
            const grid = document.getElementById('preset-grid');
            grid.innerHTML = '';
            const add = (label, cls, active, onclick) => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn ' + cls;
                if (active) btn.classList.add('active');
                btn.textContent = label;
                btn.onclick = onclick;
                grid.appendChild(btn);
            };
            realGreens.forEach(g => add('📡 ' + g.name, 'wide real', selectedPreset.id === g.id, () => selectGreen(g)));
            if (!realGreens.some(g => g.id === 'real-green-1')) {
                add('📡 My green (Oct 19 scan)', 'wide real', false, () => loadRealGreen(true));
            }
            PRESETS.forEach(p => add(p.name, '', selectedPreset.id === p.id, () => selectGreen(p)));
            add('📂 Load scan file (PLY or height map)', 'wide', false, () => document.getElementById('scan-file').click());
        }

        function loadRealGreen(select) {
            return fetch(REAL_GREEN_URL, { cache: 'no-cache' })
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(json => {
                    const g = loadHeightmapObject(json, 'real-green-1');
                    if (select) selectGreen(g); else populatePresets();
                    return g;
                })
                .catch(err => { if (select) showToast('Could not load your green: ' + err.message, 4000); });
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================

        function handleCanvasTap(e) {
            if (!placementMode) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const screenX = (e.clientX || e.touches?.[0]?.clientX || 0) - rect.left;
            const screenY = (e.clientY || e.touches?.[0]?.clientY || 0) - rect.top;
            const world = screenToWorld({ x: screenX, y: screenY });
            if (!isOnGreen(world.x, world.z)) {
                showToast('That spot is off the scanned green. Tap inside the colored area.', 2500);
                return;
            }
            if (placementMode === 'hole') holeMarker = world;
            else if (placementMode === 'ball') ballMarker = world;
            placementMode = null;
            updateUI();
        }

        // Pointers: in placement mode a tap places the marker; otherwise one finger pans, two fingers zoom.
        const activePointers = new Map();
        let gestureStart = null;
        function canvasPoint(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        function startGesture() {
            const pts = [...activePointers.values()];
            const mid = pts.length > 1 ? { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 } : pts[0];
            const span = pts.length > 1 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0;
            gestureStart = { mid, span, zoom: viewZoom, panX: viewPanX, panY: viewPanY, n: pts.length };
        }
        function onPointerDown(e) {
            if (placementMode) { handleCanvasTap(e); return; }
            e.preventDefault();
            if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
            activePointers.set(e.pointerId, canvasPoint(e));
            gestureActive = true;
            startGesture();
        }
        function onPointerMove(e) {
            if (!activePointers.has(e.pointerId) || !gestureStart) return;
            e.preventDefault();
            activePointers.set(e.pointerId, canvasPoint(e));
            const pts = [...activePointers.values()];
            if (pts.length !== gestureStart.n) { startGesture(); return; }
            const mid = pts.length > 1 ? { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 } : pts[0];
            let z = gestureStart.zoom;
            if (pts.length > 1 && gestureStart.span > 10) {
                const span = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                z = Math.max(1, Math.min(8, gestureStart.zoom * span / gestureStart.span));
            }
            const k = z / gestureStart.zoom;
            viewZoom = z;
            viewPanX = mid.x - (gestureStart.mid.x - gestureStart.panX) * k;
            viewPanY = mid.y - (gestureStart.mid.y - gestureStart.panY) * k;
            if (viewZoom === 1 && pts.length > 1) { viewPanX = 0; viewPanY = 0; }
            render();
        }
        function onPointerUp(e) {
            activePointers.delete(e.pointerId);
            if (activePointers.size) { startGesture(); return; }
            gestureActive = false;
            gestureStart = null;
            render();
        }
        if ('PointerEvent' in window) {
            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerUp);
        } else {
            canvas.addEventListener('touchstart', handleCanvasTap);
            canvas.addEventListener('click', handleCanvasTap);
        }

        document.getElementById('place-hole-btn').addEventListener('click', () => { placementMode = 'hole'; updateUI(); });
        document.getElementById('place-ball-btn').addEventListener('click', () => { placementMode = 'ball'; updateUI(); });
        document.getElementById('reset-btn').addEventListener('click', () => {
            holeMarker = null; ballMarker = null; placementMode = null; updateUI();
        });
        document.getElementById('power-slider').addEventListener('input', (e) => { puttPower = parseInt(e.target.value); scheduleUI(); });
        document.getElementById('stimp-slider').addEventListener('input', (e) => { stimp = parseFloat(e.target.value); scheduleUI(); });
        document.getElementById('toggle-contours-btn').addEventListener('click', () => { showContours = !showContours; updateUI(); });
        document.getElementById('toggle-line-btn').addEventListener('click', () => { showLine = !showLine; updateUI(); });
        document.getElementById('fit-view-btn').addEventListener('click', () => { resetView(); updateUI(); });
        document.getElementById('ar-view-btn').addEventListener('click', () => { saveSimState(); window.location.href = arViewHref(); });
        document.getElementById('scan-file').addEventListener('change', (e) => {
            handleScanFile(e.target.files && e.target.files[0]);
            e.target.value = '';
        });

        // ============================================
        // INITIALIZATION - AT END
        // ============================================

        window.addEventListener('resize', resizeCanvas);
        populatePresets();
        updateGreenInfo();
        resizeCanvas();
        updateUI();
        // Open on the real green by default; ?green=preset keeps the synthetic ones;
        // ?green=last-scan (or a preset id) comes back from the AR view.
        (function initGreen() {
            const want = new URLSearchParams(window.location.search).get('green');
            const remembered = restoreLastScan();
            if (remembered) populatePresets();
            const preset = PRESETS.find(p => p.id === want);
            if (want === LAST_SCAN_ID && remembered) { selectGreen(remembered); applyUrlState(); loadRealGreen(false); }
            else if (preset) { selectGreen(preset); applyUrlState(); loadRealGreen(false); }
            else if (want === 'preset') { loadRealGreen(false); applyUrlState(); }
            else loadRealGreen(true).then(() => applyUrlState());
        })();
    </script>
</body>
</html>
