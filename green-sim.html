<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>PuttGuide - 3D Green Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.9);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(34, 197, 94, 0.3);
        }

        header h1 {
            font-size: 18px;
            font-weight: bold;
            color: #22c55e;
        }

        .badge {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
        }

        #green-canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        #info-overlay {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            pointer-events: none;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        #controls {
            background: rgba(0, 0, 0, 0.95);
            padding: 16px;
            max-height: 50vh;
            overflow-y: auto;
            border-top: 1px solid rgba(34, 197, 94, 0.3);
        }

        .control-section {
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: #22c55e;
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.8);
            color: white;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .preset-btn {
            padding: 10px 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
        }

        .preset-btn.active {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
        }

        .slider-control {
            margin-bottom: 12px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .slider-value {
            color: #22c55e;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #22c55e;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #22c55e;
            cursor: pointer;
            border: none;
        }

        .distance-display {
            background: rgba(34, 197, 94, 0.15);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .distance-value {
            font-size: 22px;
            font-weight: bold;
            color: #22c55e;
        }

        .distance-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 11px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .disclaimer {
            background: rgba(255, 200, 0, 0.1);
            border: 1px solid rgba(255, 200, 0, 0.3);
            padding: 8px;
            border-radius: 6px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.3;
            margin-top: 8px;
        }

        #controls::-webkit-scrollbar {
            width: 0px;
        }
        .preset-btn.wide { grid-column: span 3; padding: 12px 6px; font-size: 12px; }
        .preset-btn.real { border-color: rgba(100, 200, 255, 0.5); }
        .preset-btn.real.active { background: rgba(100, 200, 255, 0.25); border-color: #64c8ff; }
        .green-info { font-size: 11px; color: rgba(255,255,255,0.75); line-height: 1.4; margin-top: 8px; }
        .green-info b { color: #64c8ff; }
        #toast { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85);
                 padding: 8px 14px; border-radius: 8px; font-size: 12px; pointer-events: none; display: none;
                 border: 1px solid rgba(251, 191, 36, 0.5); max-width: 90%; text-align: center; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🏌️ Green Simulator</h1>
            <span class="badge" id="header-badge">3D Contour View</span>
        </header>

        <div id="canvas-container">
            <canvas id="green-canvas"></canvas>
            <div id="info-overlay">Tap to place hole and ball</div>
            <div id="toast"></div>
        </div>

        <div id="controls">
            <!-- Marker Placement -->
            <div class="control-section">
                <div class="btn-group">
                    <button class="btn btn-primary" id="place-hole-btn">🚩 Hole</button>
                    <button class="btn btn-primary" id="place-ball-btn">⚪ Ball</button>
                    <button class="btn btn-danger" id="reset-btn">🔄 Reset</button>
                </div>
                <button class="btn btn-primary" id="ar-view-btn" style="width:100%;margin-top:8px;background:#22c55e;color:#000;font-weight:800">📷 See this putt in the camera (AR view)</button>
            </div>

            <!-- Distance -->
            <div class="control-section" id="distance-section" style="display: none;">
                <div class="distance-display">
                    <div class="distance-label">Putt Distance</div>
                    <div class="distance-value" id="distance-value">0.0m</div>
                </div>
            </div>

            <!-- Green choice -->
            <div class="control-section">
                <div class="section-title">Green</div>
                <div class="preset-grid" id="preset-grid"></div>
                <input type="file" id="scan-file" style="display:none">
                <div class="green-info" id="green-info"></div>
            </div>

            <!-- Putt Physics -->
            <div class="control-section">
                <div class="section-title">Putt Power / Speed</div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span id="power-label">Medium</span>
                        <span class="slider-value" id="power-value">50%</span>
                    </div>
                    <input type="range" id="power-slider" min="0" max="100" value="50">
                </div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span>Green speed (Stimpmeter)</span>
                        <span class="slider-value" id="stimp-value">10</span>
                    </div>
                    <input type="range" id="stimp-slider" min="6" max="14" step="0.5" value="10">
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <span style="color: #ef4444;">●</span>
                        <span>Soft (more break)</span>
                    </div>
                    <div class="legend-item">
                        <span style="color: #22c55e;">●</span>
                        <span>Hard (holds line)</span>
                    </div>
                </div>
            </div>

            <!-- Visualization -->
            <div class="control-section">
                <div class="section-title">Visualization</div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="toggle-contours-btn">Hide Contours</button>
                    <button class="btn btn-secondary" id="toggle-line-btn">Hide Line</button>
                    <button class="btn btn-secondary" id="fit-view-btn">⤢ Whole green</button>
                </div>
                <div class="green-info">Pinch to zoom, drag to move the green.</div>
            </div>

            <!-- Height Legend -->
            <div class="control-section">
                <div class="section-title">Elevation</div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-color" style="background: #1a4d2e;"></div><span>Low</span></div>
                    <div class="legend-item"><div class="legend-color" style="background: #2d5a3d;"></div><span>↑</span></div>
                    <div class="legend-item"><div class="legend-color" style="background: #4a7c59;"></div><span>↑</span></div>
                    <div class="legend-item"><div class="legend-color" style="background: #6b9f78;"></div><span>High</span></div>
                    <div class="legend-item"><span style="color:#fff;">➜</span><span>Downhill</span></div>
                </div>
            </div>

            <div class="disclaimer" id="disclaimer"></div>
        </div>
    </div>
    <script>
        // ============================================
        // STATE - FIRST
        // ============================================

        let holeMarker = null;
        let ballMarker = null;
        let placementMode = null;
        let selectedPreset = null;   // the active green (synthetic preset or measured grid)
        let puttPower = 50;          // 0-100: how far past the hole the putt would roll
        let stimp = 10;              // green speed, Stimpmeter feet
        let showContours = true;
        let showLine = true;
        let lastSolution = null;
        let lastSolutionKey = '';

        // ============================================
        // PHYSICS CONSTANTS
        // ============================================
        // Ball rolls (not slides): slope pull on a rolling solid sphere is 5/7 g sin(theta).
        // Rolling resistance is calibrated from the Stimpmeter: the ramp releases the ball
        // at 1.83 m/s and it rolls `stimp` feet on flat, so decel = 1.83^2 / (2 * stimp ft).
        // Stimp 10 -> 0.55 m/s^2.
        const G = 9.81;
        const ROLL = 5 / 7;
        function rollDecel() {
            const d = Math.max(1, stimp) * 0.3048;
            return 1.83 * 1.83 / (2 * d);
        }

        // ============================================
        // GREENS
        // ============================================
        // Synthetic greens are analytic height fields (meters). Slopes are kept in the
        // 1-4% range of real greens so they behave sensibly at Stimp 10.
        const PRESETS = [
            { id: 'flat', name: 'Flat', heightField: (x, z) => x * 0.001 },
            { id: 'slope-rl', name: 'Slope R→L', heightField: (x, z) => x * 0.025 }, // sidehill: a putt down the screen breaks left
            { id: 'slope-lr', name: 'Slope L→R', heightField: (x, z) => -x * 0.025 }, // sidehill: a putt down the screen breaks right
            { id: 'ridge', name: 'Ridge', heightField: (x, z) => 0.12 - Math.sqrt(x * x + 0.36) * 0.03 },
            { id: 'bowl', name: 'Bowl', heightField: (x, z) => Math.sqrt(x * x + 0.36) * 0.03 - 0.06 },
            { id: 'double', name: 'S-Curve', heightField: (x, z) => Math.sin(z / 3 * Math.PI * 2) * 0.015 + x * 0.01 }
        ];
        PRESETS.forEach(p => { p.kind = 'fn'; });

        // Measured greens (grid). Filled in by loadGridGreen().
        const REAL_GREEN_URL = 'samples/real-green-1.json';
        let realGreens = [];   // [{id, name, kind:'grid', ...}]

        selectedPreset = PRESETS[1];

        // Build a grid green from a PuttGuide height map (samples/*.json format).
        function makeGridGreen(json, id) {
            const cols = json.cols, rows = json.rows;
            const csx = json.cellSizeX || json.cellSize, csz = json.cellSizeZ || json.cellSize;
            const scale = json.heightUnits === 'mm' ? 0.001 : (json.heightUnits === 'cm' ? 0.01 : 1);
            const n = cols * rows;
            const h = new Float32Array(n);
            const mask = new Uint8Array(n);
            for (let i = 0; i < n; i++) {
                const v = json.heights[i];
                h[i] = (v === null || v === undefined) ? NaN : v * scale;
            }
            for (let r = 0; r < rows; r++) {
                const row = json.mask ? json.mask[r] : null;
                for (let c = 0; c < cols; c++) mask[r * cols + c] = row ? (row.charCodeAt(c) === 49 ? 1 : 0) : 1;
            }
            const low = new Uint8Array(n);
            if (json.lowConfidence) {
                for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
                    low[r * cols + c] = json.lowConfidence[r].charCodeAt(c) === 49 ? 1 : 0;
            }
            // Masked/missing cells take the nearest measured height so interpolation is stable at edges.
            fillNearest(h, cols, rows);
            // Gradient at cell centres (central differences), interpolated during the roll.
            const gx = new Float32Array(n), gz = new Float32Array(n);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const c0 = Math.max(0, c - 1), c1 = Math.min(cols - 1, c + 1);
                    const r0 = Math.max(0, r - 1), r1 = Math.min(rows - 1, r + 1);
                    gx[r * cols + c] = (h[r * cols + c1] - h[r * cols + c0]) / ((c1 - c0) * csx || 1);
                    gz[r * cols + c] = (h[r1 * cols + c] - h[r0 * cols + c]) / ((r1 - r0) * csz || 1);
                }
            }
            const ox = json.origin ? json.origin.x : 0, oz = json.origin ? json.origin.z : 0;
            // Stats over on-green cells.
            let hmin = Infinity, hmax = -Infinity, sgx = 0, sgz = 0, cnt = 0, slopes = [], lowCnt = 0;
            for (let i = 0; i < n; i++) {
                if (!mask[i]) continue;
                hmin = Math.min(hmin, h[i]); hmax = Math.max(hmax, h[i]);
                sgx += gx[i]; sgz += gz[i]; cnt++;
                slopes.push(Math.hypot(gx[i], gz[i]));
                if (low[i]) lowCnt++;
            }
            slopes.sort((a, b) => a - b);
            const g = {
                id: id || ('grid-' + Date.now()), name: json.name || 'Scanned green', kind: 'grid',
                cols, rows, csx, csz, ox, oz, h, gx, gz, mask, low,
                bounds: { x0: ox, x1: ox + cols * csx, z0: oz, z1: oz + rows * csz },
                stats: {
                    areaM2: cnt * csx * csz,
                    rangeM: hmax - hmin, hmin, hmax,
                    medianSlope: slopes.length ? slopes[Math.floor(slopes.length / 2)] : 0,
                    meanGx: cnt ? sgx / cnt : 0, meanGz: cnt ? sgz / cnt : 0,
                    lowM2: lowCnt * csx * csz
                },
                captureDate: json.captureDate || ''
            };
            // Bounding box of the on-green cells (used for the view).
            let c0 = cols, c1 = -1, r0 = rows, r1 = -1;
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (mask[r * cols + c]) {
                c0 = Math.min(c0, c); c1 = Math.max(c1, c); r0 = Math.min(r0, r); r1 = Math.max(r1, r);
            }
            if (c1 >= 0) g.bounds = { x0: ox + c0 * csx, x1: ox + (c1 + 1) * csx, z0: oz + r0 * csz, z1: oz + (r1 + 1) * csz };
            return g;
        }

        function fillNearest(h, cols, rows) {
            const n = cols * rows;
            const q = new Int32Array(n);
            let qh = 0, qt = 0;
            const seen = new Uint8Array(n);
            for (let i = 0; i < n; i++) if (!isNaN(h[i])) { seen[i] = 1; q[qt++] = i; }
            if (!qt) { h.fill(0); return; }
            while (qh < qt) {
                const i = q[qh++], r = (i / cols) | 0, c = i - r * cols;
                const nb = [r > 0 ? i - cols : -1, r < rows - 1 ? i + cols : -1, c > 0 ? i - 1 : -1, c < cols - 1 ? i + 1 : -1];
                for (const j of nb) if (j >= 0 && !seen[j]) { seen[j] = 1; h[j] = h[i]; q[qt++] = j; }
            }
        }

        // Convert the scan checker's "Download Height Map" file (green_capture.json).
        // Its heightData[row][col] is in meters; rows run along the scan's depth axis,
        // cols along its width; every cell is filled, so there is no off-green mask.
        function checkerJsonToHeightmap(j) {
            const grid = j.heightData;
            const rows = grid.length, cols = grid[0].length;
            const heights = [];
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
                const v = grid[r][c];
                heights.push(v === null || v === undefined ? null : Math.round(v * 1000));
            }
            return {
                format: 'puttguide-heightmap', version: 1,
                name: j.name || 'Checker height map', captureDate: j.captureDate || '',
                cols, rows, cellSizeX: (j.widthMeters || cols * 0.1) / cols, cellSizeZ: (j.heightMeters || rows * 0.1) / rows,
                origin: { x: -(j.widthMeters || 0) / 2, z: -(j.heightMeters || 0) / 2 },
                heightUnits: 'mm', heights, mask: null, lowCoverage: true
            };
        }

        // ============================================
        // CANVAS SETUP
        // ============================================

        const canvas = document.getElementById('green-canvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth = 400, canvasHeight = 400;
        let dpr = window.devicePixelRatio || 1;

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            dpr = window.devicePixelRatio || 1;
            canvasWidth = container.clientWidth || 400;
            canvasHeight = container.clientHeight || 400;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            bgCacheKey = '';
            // Pan is in pixels, so re-fit after a size change (rotation, Safari toolbar).
            if (typeof viewZoom !== 'undefined') {
                if (selectedPreset.kind === 'grid' && ballMarker && holeMarker) zoomToPutt(); else resetView();
            }
            render();
        }

        // ============================================
        // COORDINATE SYSTEMS
        // ============================================
        // World meters: x to the right, z down the screen. Synthetic greens are 10 m wide
        // and fill the screen. Measured greens are fitted with equal x/z scale (no stretch).

        function greenBounds() {
            if (selectedPreset.kind === 'grid') return selectedPreset.bounds;
            const aspect = canvasHeight / Math.max(1, canvasWidth);
            return { x0: -5, x1: 5, z0: -5 * aspect, z1: 5 * aspect };
        }

        // Pinch to zoom / drag to pan (when not placing a marker). screen = fit(world) * zoom + pan
        let viewZoom = 1, viewPanX = 0, viewPanY = 0;
        function viewTransform() {
            const b = greenBounds();
            const pad = selectedPreset.kind === 'grid' ? 10 : 0;
            const w = b.x1 - b.x0, h = b.z1 - b.z0;
            const s = Math.min((canvasWidth - 2 * pad) / w, (canvasHeight - 2 * pad) / h);
            const ox = (canvasWidth - w * s) / 2 - b.x0 * s, oy = (canvasHeight - h * s) / 2 - b.z0 * s;
            return { s: s * viewZoom, ox: ox * viewZoom + viewPanX, oy: oy * viewZoom + viewPanY };
        }
        function resetView() { viewZoom = 1; viewPanX = 0; viewPanY = 0; bgCacheKey = ''; }
        // Zoom so the ball, hole and a margin for the break fill most of the screen.
        function zoomToPutt() {
            if (!ballMarker || !holeMarker) { resetView(); return; }
            resetView();
            const m = 1.3;
            const p0 = worldToScreen({ x: Math.min(ballMarker.x, holeMarker.x) - m, z: Math.min(ballMarker.z, holeMarker.z) - m });
            const p1 = worldToScreen({ x: Math.max(ballMarker.x, holeMarker.x) + m, z: Math.max(ballMarker.z, holeMarker.z) + m });
            const top = 56; // room for the info box at the top
            const z = Math.max(1, Math.min(4, Math.min(canvasWidth / (p1.x - p0.x), (canvasHeight - top) / (p1.y - p0.y))));
            viewZoom = z;
            viewPanX = canvasWidth / 2 - (p0.x + p1.x) / 2 * z;
            viewPanY = top + (canvasHeight - top) / 2 - (p0.y + p1.y) / 2 * z;
        }

        function worldToScreen(world) {
            const v = viewTransform();
            return { x: world.x * v.s + v.ox, y: world.z * v.s + v.oy };
        }

        function screenToWorld(screen) {
            const v = viewTransform();
            return { x: (screen.x - v.ox) / v.s, z: (screen.y - v.oy) / v.s };
        }

        function distance(p1, p2) {
            const dx = p2.x - p1.x;
            const dz = p2.z - p1.z;
            return Math.sqrt(dx * dx + dz * dz);
        }

        function normalize(vec) {
            const len = Math.sqrt(vec.x * vec.x + vec.z * vec.z);
            if (len < 0.0001) return { x: 0, z: 0 };
            return { x: vec.x / len, z: vec.z / len };
        }

        // ============================================
        // HEIGHT FIELD & GRADIENT
        // ============================================

        function gridSample(arr, g, x, z) {
            let fx = (x - g.ox) / g.csx - 0.5, fz = (z - g.oz) / g.csz - 0.5;
            fx = Math.max(0, Math.min(g.cols - 1.001, fx));
            fz = Math.max(0, Math.min(g.rows - 1.001, fz));
            const c = fx | 0, r = fz | 0, tx = fx - c, tz = fz - r;
            const i = r * g.cols + c;
            const c1 = c + 1 < g.cols ? 1 : 0, r1 = r + 1 < g.rows ? g.cols : 0;
            const a = arr[i] * (1 - tx) + arr[i + c1] * tx;
            const b = arr[i + r1] * (1 - tx) + arr[i + r1 + c1] * tx;
            return a * (1 - tz) + b * tz;
        }

        function getHeight(x, z) {
            if (selectedPreset.kind === 'grid') return gridSample(selectedPreset.h, selectedPreset, x, z);
            return selectedPreset.heightField(x, z);
        }

        function getGradient(x, z, delta = 0.02) {
            const g = selectedPreset;
            if (g.kind === 'grid') return { x: gridSample(g.gx, g, x, z), z: gridSample(g.gz, g, x, z) };
            return {
                x: (getHeight(x + delta, z) - getHeight(x - delta, z)) / (2 * delta),
                z: (getHeight(x, z + delta) - getHeight(x, z - delta)) / (2 * delta)
            };
        }

        // True when (x, z) is on measured green. Synthetic greens are on-green inside the view.
        function isOnGreen(x, z) {
            const g = selectedPreset;
            if (g.kind !== 'grid') {
                const b = greenBounds();
                return x >= b.x0 - 1 && x <= b.x1 + 1 && z >= b.z0 - 1 && z <= b.z1 + 1;
            }
            const c = Math.floor((x - g.ox) / g.csx), r = Math.floor((z - g.oz) / g.csz);
            if (c < 0 || r < 0 || c >= g.cols || r >= g.rows) return false;
            return g.mask[r * g.cols + c] === 1;
        }

        // ============================================
        // PUTT PHYSICS SIMULATION
        // ============================================
        // a = -(5/7) g grad z - d * v_hat   (d = rolling resistance from Stimp)

        // How far the putt would roll past the hole if it missed (pace), from the power slider.
        // Soft ~0.1 m (dies at the cup), medium ~0.3 m, hard ~0.7-1.1 m past.
        function paceForPower(power) {
            const p = Math.max(0, Math.min(1, power / 100));
            return 0.05 + Math.pow(p, 2.2) * 1.05;
        }

        // First guess at launch speed from energy: 1/2 v0^2 = d*L + (5/7) g dh + d*pace.
        function launchSpeed(targetDist, power, ball, hole) {
            const d = rollDecel();
            const dist = Math.max(0.25, targetDist);
            let climb = 0;
            if (ball && hole) climb = getHeight(hole.x, hole.z) - getHeight(ball.x, ball.z);
            const path = dist * 1.05; // break makes the roll a bit longer than the straight line
            const energy = d * path + ROLL * G * climb + d * paceForPower(power);
            return Math.sqrt(2 * Math.max(0.03, energy));
        }

        function distPointToSegment(p, a, b) {
            const abx = b.x - a.x, abz = b.z - a.z;
            const apx = p.x - a.x, apz = p.z - a.z;
            const ab2 = abx * abx + abz * abz;
            if (ab2 < 1e-12) return Math.hypot(apx, apz);
            let t = (apx * abx + apz * abz) / ab2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (a.x + abx * t), p.z - (a.z + abz * t));
        }

        // record=false is the fast probe used by the aim search: no path is stored, the
        // roll ends at capture, and the closest approach to the cup is tracked instead.
        function simulatePuttWithAim(ball, aimAngle, power, maxDist = 22, cupPos = null, cupRadius = 0.08, v0Override = null, record = true) {
            const d = rollDecel();
            let dt = 0.008;
            const targetDist = cupPos ? distance(ball, cupPos) : maxDist;
            const v0 = v0Override !== null ? v0Override : launchSpeed(targetDist, power, ball, cupPos);
            // Unit vector ball -> cup, used to stop early once a miss is well past the cup.
            const ux = cupPos ? (cupPos.x - ball.x) / Math.max(1e-6, targetDist) : 0;
            const uz = cupPos ? (cupPos.z - ball.z) / Math.max(1e-6, targetDist) : 0;
            const cx = cupPos ? cupPos.x : 0, cz = cupPos ? cupPos.z : 0, cr2 = cupRadius * cupRadius;
            const farLimit = Math.max(maxDist, targetDist * 3);
            const g = selectedPreset;
            const isGrid = g.kind === 'grid';
            const hf = g.heightField;
            const b = isGrid ? null : greenBounds();
            const k = ROLL * G;
            let px = ball.x, pz = ball.z;
            let vx = v0 * Math.cos(aimAngle), vz = v0 * Math.sin(aimAngle);
            const points = [{ x: px, z: pz }];
            let captureIndex = null, capturedSpeed = null;
            let time = 0, step = 0;
            let stopped = false, offGreen = false, passed = false;
            let gxv = 0, gzv = 0;
            let closest = Infinity, closestStep = 0;
            while (time < 18) {
                if (isGrid) { gxv = gridSample(g.gx, g, px, pz); gzv = gridSample(g.gz, g, px, pz); }
                else {
                    gxv = (hf(px + 0.02, pz) - hf(px - 0.02, pz)) / 0.04;
                    gzv = (hf(px, pz + 0.02) - hf(px, pz - 0.02)) / 0.04;
                }
                const speed = Math.sqrt(vx * vx + vz * vz);
                if (speed < 0.02 && k * Math.sqrt(gxv * gxv + gzv * gzv) <= d) { stopped = true; break; }
                dt = Math.min(0.02, Math.max(0.004, 0.015 / (speed + 1e-6))); // ~1.5 cm steps
                const inv = speed > 1e-6 ? 1 / speed : 0;
                vx += (-k * gxv - d * vx * inv) * dt;
                vz += (-k * gzv - d * vz * inv) * dt;
                const qx = px, qz = pz;
                px += vx * dt; pz += vz * dt;
                step++;
                const on = isGrid ? isOnGreen(px, pz)
                    : (px >= b.x0 - 1 && px <= b.x1 + 1 && pz >= b.z0 - 1 && pz <= b.z1 + 1);
                if (!on) { offGreen = true; if (record) points.push({ x: px, z: pz }); break; }
                if (record && (step & 1) === 0) points.push({ x: px, z: pz });
                if (cupPos && captureIndex === null) {
                    // distance from cup to the segment just travelled
                    const sx = px - qx, sz = pz - qz, l2 = sx * sx + sz * sz;
                    let t = l2 > 1e-12 ? ((cx - qx) * sx + (cz - qz) * sz) / l2 : 0;
                    t = t < 0 ? 0 : (t > 1 ? 1 : t);
                    const ex = qx + sx * t - cx, ez = qz + sz * t - cz;
                    const e2 = ex * ex + ez * ez;
                    if (e2 < closest) { closest = e2; closestStep = step; }
                    if (e2 < cr2) {
                        capturedSpeed = speed;
                        if (!record) { captureIndex = 0; break; }
                        if ((step & 1) !== 0) points.push({ x: px, z: pz });
                        captureIndex = points.length - 1;
                        points[captureIndex] = { x: cx, z: cz };
                    } else if ((step & 7) === 0) {
                        const along = (px - ball.x) * ux + (pz - ball.z) * uz;
                        if (along > targetDist + 0.6) { passed = true; break; }
                    }
                }
                time += dt;
                if ((step & 15) === 0 && Math.hypot(px - ball.x, pz - ball.z) > farLimit) break;
            }
            if (record && !offGreen) points.push({ x: px, z: pz });
            return { path: points, captureIndex, capturedSpeed, v0, stopped, offGreen, passed,
                     closest: captureIndex !== null ? 0 : Math.sqrt(closest), closestAtEnd: captureIndex === null && step - closestStep <= 2 };
        }

        function pathLength(pts, from) {
            let L = 0;
            for (let i = (from || 0) + 1; i < pts.length; i++) L += distance(pts[i - 1], pts[i]);
            return L;
        }

        // Search aim offsets at a fixed launch speed. Returns the make with the smallest
        // aim offset, plus the closest miss for speed correction.
        function searchAimAtSpeed(ball, hole, power, v0, cupRadius, around = null) {
            const naiveAngle = Math.atan2(hole.z - ball.z, hole.x - ball.x);
            const distBH = Math.max(0.3, distance(ball, hole));
            const perp = { x: Math.cos(naiveAngle + Math.PI / 2), z: Math.sin(naiveAngle + Math.PI / 2) };
            const maxOffset = Math.min(4.2, Math.max(1.2, distBH * 1.1));
            const lo = around === null ? -maxOffset : Math.max(-maxOffset, around - 0.45);
            const hi = around === null ? maxOffset : Math.min(maxOffset, around + 0.45);
            function rollAt(offset) {
                const aimPoint = { x: hole.x + perp.x * offset, z: hole.z + perp.z * offset };
                const angle = Math.atan2(aimPoint.z - ball.z, aimPoint.x - ball.x);
                const result = simulatePuttWithAim(ball, angle, power, 22, hole, cupRadius, v0, false);
                return { offset, angle, result, closest: result.closest };
            }
            const coarse = around === null ? 41 : 13;
            let samples = [];
            for (let i = 0; i < coarse; i++) samples.push(rollAt(lo + (hi - lo) * (i / (coarse - 1))));
            samples.sort((a, b) => a.closest - b.closest);
            const seeds = samples.slice(0, around === null ? 3 : 2);
            let best = null;
            for (const seed of seeds) {
                for (let k = -8; k <= 8; k++) {
                    const offset = seed.offset + k * 0.025;
                    if (Math.abs(offset) > maxOffset + 0.05) continue;
                    const hit = rollAt(offset);
                    if (hit.result.captureIndex === null) continue;
                    if (!best || Math.abs(hit.offset) < Math.abs(best.offset) - 1e-4) best = hit;
                }
            }
            return { best, closest: samples[0], perp, naiveAngle };
        }

        // Distance the ball rolls past the cup after capture (Infinity if it never stops on the green).
        function overrunOf(result) {
            if (result.captureIndex === null) return null;
            if (!result.stopped) return Infinity;
            return pathLength(result.path, result.captureIndex);
        }

        function solveAimAngle(ball, hole, power, cupRadius = 0.08) {
            const d = rollDecel();
            const pace = paceForPower(power);
            // Target speed as the ball reaches the cup: the speed that would roll `pace`
            // metres further on flat green. Soft = dying at the cup, hard = firm.
            const vt = Math.sqrt(2 * d * pace);
            let v0 = launchSpeed(distance(ball, hole), power, ball, hole);
            let chosen = null, chosenErr = Infinity, lastSearch = null, around = null;
            // Speed search: bracket [lo, hi] on launch speed, energy-based guesses, bisection fallback.
            let lo = 0, hi = Infinity;
            for (let iter = 0; iter < 8; iter++) {
                let s = searchAimAtSpeed(ball, hole, power, v0, cupRadius, around);
                if (!s.best && around !== null) s = searchAimAtSpeed(ball, hole, power, v0, cupRadius, null);
                lastSearch = s;
                let guess;
                if (s.best) {
                    const vc = s.best.result.capturedSpeed;
                    const err = Math.abs(vc - vt);
                    if (err < chosenErr) { chosen = s; chosenErr = err; }
                    if (err < 0.03 + 0.08 * vt) break;
                    if (vc > vt) hi = Math.min(hi, v0); else lo = Math.max(lo, v0);
                    // Energy correction: changing v0^2 changes the speed^2 at the cup by about the same amount.
                    guess = Math.sqrt(Math.max(0.01, v0 * v0 + (vt * vt - vc * vc)));
                    around = s.best.offset;
                } else {
                    const c = s.closest;
                    const atEnd = c.result.closestAtEnd;
                    if (c.result.offGreen && atEnd && !chosen) {
                        hi = Math.min(hi, v0); guess = v0 * 0.85; // ran off the scanned green first
                    } else if (c.result.stopped && atEnd) {
                        lo = Math.max(lo, v0); guess = Math.sqrt(v0 * v0 + 2 * d * (c.closest + pace) * 1.1); // short
                    } else {
                        // Passed the hole wide at every aim: too soft to hold this line.
                        lo = Math.max(lo, v0); guess = v0 * 1.1;
                    }
                }
                if (hi - lo < 0.012) break;
                v0 = (guess > lo && guess < hi) ? guess : (isFinite(hi) ? (lo + hi) / 2 : Math.max(guess, lo * 1.1));
            }
            const s = chosen || lastSearch;
            const naiveResult = simulatePuttWithAim(ball, s.naiveAngle, power, 22, hole, cupRadius, v0);
            if (chosen) {
                const best = chosen.best;
                const result = simulatePuttWithAim(ball, best.angle, power, 22, hole, cupRadius, best.result.v0, true);
                if (result.captureIndex === null) { result.captureIndex = result.path.length - 1; } // numerical edge case
                const idx = result.captureIndex;
                const sinkPath = result.path.slice(0, idx + 1);
                sinkPath[sinkPath.length - 1] = { x: hole.x, z: hole.z };
                let overrunPath = null;
                if (idx < result.path.length - 2) {
                    const tail = result.path.slice(idx);
                    const over = distance(tail[tail.length - 1], hole);
                    if (over >= 0.22) overrunPath = tail;
                }
                const off = best.offset;
                return {
                    aimAngle: best.angle,
                    aimPoint: { x: hole.x + chosen.perp.x * off, z: hole.z + chosen.perp.z * off },
                    sinkPath, overrunPath,
                    naivePath: naiveResult.path,
                    aimOffset: Math.abs(off),
                    offsetDir: off > 0.03 ? 'R' : (off < -0.03 ? 'L' : ''),
                    captureSpeed: result.capturedSpeed,
                    v0: result.v0,
                    overrun: overrunOf(result),
                    runsOff: result.offGreen,
                    missed: false
                };
            }
            return {
                aimAngle: s.naiveAngle, aimPoint: hole,
                sinkPath: naiveResult.path, overrunPath: null, naivePath: naiveResult.path,
                aimOffset: 0, offsetDir: '', captureSpeed: null, v0,
                runsOff: naiveResult.offGreen, missed: true
            };
        }

        function getSolution() {
            if (!ballMarker || !holeMarker) return null;
            const key = [selectedPreset.id, ballMarker.x, ballMarker.z, holeMarker.x, holeMarker.z, puttPower, stimp].join('|');
            if (key !== lastSolutionKey) {
                lastSolution = solveAimAngle(ballMarker, holeMarker, puttPower);
                lastSolutionKey = key;
            }
            return lastSolution;
        }

        // ============================================
        // SELF-TEST  (open green-sim.html?test and check the console)
        // ============================================

        function runSelfTest() {
            console.log('=== PuttGuide Aim Solver Self-Test ===\n');
            const tests = [
                { preset: 'slope-lr', name: 'Slope L→R (4m)', ball: { x: -2, z: 0 }, hole: { x: 2, z: 0 } },
                { preset: 'slope-rl', name: 'Slope R→L (4m)', ball: { x: 2, z: 0 }, hole: { x: -2, z: 0 } },
                { preset: 'slope-lr', name: 'Sidehill L→R (3m, down screen)', ball: { x: 0, z: -1.5 }, hole: { x: 0, z: 1.5 } },
                { preset: 'slope-rl', name: 'Sidehill R→L (3m, down screen)', ball: { x: 0, z: -1.5 }, hole: { x: 0, z: 1.5 } },
                { preset: 'slope-lr', name: 'Sidehill L→R (6m)', ball: { x: 0, z: -3 }, hole: { x: 0, z: 3 } }
            ];
            const saved = selectedPreset;
            let passed = 0;
            const results = [];
            tests.forEach(test => {
                selectedPreset = PRESETS.find(p => p.id === test.preset);
                const softSol = solveAimAngle(test.ball, test.hole, 30);
                const hardSol = solveAimAngle(test.ball, test.hole, 80);
                const softOver = softSol.overrunPath ? distance(test.hole, softSol.overrunPath[softSol.overrunPath.length - 1]) : 0;
                const hardOver = hardSol.overrunPath ? distance(test.hole, hardSol.overrunPath[hardSol.overrunPath.length - 1]) : 0;
                const checks = [
                    { name: 'Soft sinks', pass: !softSol.missed },
                    { name: 'Hard sinks', pass: !hardSol.missed },
                    { name: 'Soft aims more outside', pass: softSol.aimOffset >= hardSol.aimOffset },
                    { name: 'Soft less overrun', pass: softOver <= hardOver }
                ];
                const ok = checks.every(c => c.pass);
                if (ok) passed++;
                const line = `${test.name}: soft aim ${softSol.aimOffset.toFixed(2)}m ${softSol.offsetDir}, hard aim ${hardSol.aimOffset.toFixed(2)}m ${hardSol.offsetDir}, overrun soft ${softOver.toFixed(2)} / hard ${hardOver.toFixed(2)} ${ok ? '✅' : '❌ ' + checks.filter(c => !c.pass).map(c => c.name).join(', ')}`;
                console.log(line);
                results.push({ name: test.name, ok, line });
            });
            selectedPreset = saved;
            console.log(`=== Results: ${passed}/${tests.length} passed ===`);
            return { passed, total: tests.length, results };
        }

        window.addEventListener('load', () => {
            if (window.location.search.includes('test')) setTimeout(runSelfTest, 1000);
        });

        // ============================================
        // RENDERING
        // ============================================

        function render() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            drawBackground();
            if (showLine && holeMarker && ballMarker) renderPuttLine();
            if (holeMarker) renderHole(holeMarker);
            if (ballMarker) renderBall(ballMarker);
        }


        // ============================================
        // GREEN SURFACE (cached per green + canvas size)
        // ============================================

        let bgCanvas = null, bgCacheKey = '';

        // Sample the active green on a regular grid in world space.
        function sampleGreenGrid() {
            const g = selectedPreset;
            if (g.kind === 'grid') {
                return { cols: g.cols, rows: g.rows, x0: g.ox, z0: g.oz, dx: g.csx, dz: g.csz,
                         h: g.h, mask: g.mask, low: g.low };
            }
            const b = greenBounds();
            const step = 0.1;
            const cols = Math.ceil((b.x1 - b.x0) / step), rows = Math.ceil((b.z1 - b.z0) / step);
            const h = new Float32Array(cols * rows), mask = new Uint8Array(cols * rows).fill(1);
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
                h[r * cols + c] = getHeight(b.x0 + (c + 0.5) * step, b.z0 + (r + 0.5) * step);
            return { cols, rows, x0: b.x0, z0: b.z0, dx: step, dz: step, h, mask, low: null };
        }

        function niceInterval(range) {
            const target = range / 14;
            const opts = [0.005, 0.01, 0.02, 0.025, 0.05, 0.1];
            for (const o of opts) if (o >= target) return o;
            return 0.1;
        }

        function buildBackground() {
            const off = document.createElement('canvas');
            off.width = Math.max(1, Math.round(canvasWidth * dpr));
            off.height = Math.max(1, Math.round(canvasHeight * dpr));
            const c = off.getContext('2d');
            c.setTransform(dpr, 0, 0, dpr, 0, 0);
            c.fillStyle = '#141414';
            c.fillRect(0, 0, canvasWidth, canvasHeight);
            const S = sampleGreenGrid();
            const v = viewTransform();
            let hmin = Infinity, hmax = -Infinity;
            for (let i = 0; i < S.h.length; i++) if (S.mask[i]) { hmin = Math.min(hmin, S.h[i]); hmax = Math.max(hmax, S.h[i]); }
            const range = Math.max(0.01, hmax - hmin);
            const cw = S.dx * v.s, ch = S.dz * v.s;
            // Heat/shade cells
            for (let r = 0; r < S.rows; r++) {
                for (let col = 0; col < S.cols; col++) {
                    const i = r * S.cols + col;
                    if (!S.mask[i]) continue;
                    const x = S.x0 + col * S.dx, z = S.z0 + r * S.dz;
                    const sx = x * v.s + v.ox, sy = z * v.s + v.oy;
                    const t = (S.h[i] - hmin) / range;
                    const grad = getGradient(x + S.dx / 2, z + S.dz / 2);
                    const slope = Math.hypot(grad.x, grad.z);
                    const shade = Math.max(0.55, 1 - slope * 3);
                    let R = (26 + t * 81) * shade, Gc = (77 + t * 82) * shade, B = (46 + t * 74) * shade;
                    c.fillStyle = `rgb(${R | 0}, ${Gc | 0}, ${B | 0})`;
                    c.fillRect(sx, sy, cw + 0.6, ch + 0.6);
                }
            }
            if (S.low) {
                // Faint hatching where the scan has two overlapping surfaces (less certain heights).
                c.strokeStyle = 'rgba(255, 255, 255, 0.10)';
                c.lineWidth = 1;
                c.beginPath();
                for (let r = 0; r < S.rows; r++) for (let col = 0; col < S.cols; col++) {
                    const i = r * S.cols + col;
                    if (!S.low[i] || !S.mask[i] || (r + col) % 2) continue;
                    const sx = (S.x0 + col * S.dx) * v.s + v.ox, sy = (S.z0 + r * S.dz) * v.s + v.oy;
                    c.moveTo(sx, sy + ch); c.lineTo(sx + cw, sy);
                }
                c.stroke();
            }
            if (showContours) {
                // Marching squares contours on the sampled grid.
                const interval = niceInterval(range);
                const first = Math.ceil(hmin / interval) * interval;
                let idx = 0;
                for (let level = first; level <= hmax; level += interval, idx++) {
                    const major = Math.round(level / interval) % 5 === 0;
                    c.beginPath();
                    for (let r = 0; r < S.rows - 1; r++) {
                        for (let col = 0; col < S.cols - 1; col++) {
                            const i00 = r * S.cols + col, i10 = i00 + 1, i01 = i00 + S.cols, i11 = i01 + 1;
                            if (!(S.mask[i00] && S.mask[i10] && S.mask[i01] && S.mask[i11])) continue;
                            const a = S.h[i00], b = S.h[i10], d = S.h[i01], e = S.h[i11];
                            const code = (a > level ? 1 : 0) | (b > level ? 2 : 0) | (e > level ? 4 : 0) | (d > level ? 8 : 0);
                            if (code === 0 || code === 15) continue;
                            const X = (cc) => (S.x0 + (cc + 0.5) * S.dx) * v.s + v.ox;
                            const Y = (rr) => (S.z0 + (rr + 0.5) * S.dz) * v.s + v.oy;
                            const pts = [];
                            const edge = (p, q, cp, cq, rp, rq) => {
                                const tt = (level - p) / (q - p);
                                pts.push([X(cp + (cq - cp) * tt), Y(rp + (rq - rp) * tt)]);
                            };
                            if ((a > level) !== (b > level)) edge(a, b, col, col + 1, r, r);
                            if ((b > level) !== (e > level)) edge(b, e, col + 1, col + 1, r, r + 1);
                            if ((d > level) !== (e > level)) edge(d, e, col, col + 1, r + 1, r + 1);
                            if ((a > level) !== (d > level)) edge(a, d, col, col, r, r + 1);
                            for (let k = 0; k + 1 < pts.length; k += 2) {
                                c.moveTo(pts[k][0], pts[k][1]);
                                c.lineTo(pts[k + 1][0], pts[k + 1][1]);
                            }
                        }
                    }
                    if (major) {
                        c.strokeStyle = 'rgba(255, 255, 255, 0.15)'; c.lineWidth = 3; c.stroke();
                        c.strokeStyle = 'rgba(255, 255, 255, 0.45)'; c.lineWidth = 1.5; c.stroke();
                    } else {
                        c.strokeStyle = 'rgba(255, 255, 255, 0.2)'; c.lineWidth = 1; c.stroke();
                    }
                }
                // Downhill arrows (fall line), about every 0.8 m on screen-size greens.
                const spacing = Math.max(0.5, Math.round((Math.min(S.cols * S.dx, S.rows * S.dz) / 9) * 2) / 2);
                const b = selectedPreset.kind === 'grid' ? selectedPreset.bounds : greenBounds();
                c.strokeStyle = 'rgba(255, 255, 255, 0.55)';
                c.fillStyle = 'rgba(255, 255, 255, 0.55)';
                c.lineWidth = 1.5;
                for (let z = b.z0 + spacing / 2; z < b.z1; z += spacing) {
                    for (let x = b.x0 + spacing / 2; x < b.x1; x += spacing) {
                        if (!isOnGreen(x, z)) continue;
                        const gr = getGradient(x, z);
                        const sl = Math.hypot(gr.x, gr.z);
                        if (sl < 0.004) continue;
                        const len = Math.min(18, 6 + sl * 250);
                        const ux = -gr.x / sl, uz = -gr.z / sl;
                        const sx = x * v.s + v.ox, sy = z * v.s + v.oy;
                        const ex = sx + ux * len, ey = sy + uz * len;
                        c.beginPath(); c.moveTo(sx - ux * len * 0.3, sy - uz * len * 0.3); c.lineTo(ex, ey); c.stroke();
                        c.beginPath();
                        c.moveTo(ex, ey);
                        c.lineTo(ex - ux * 5 - uz * 3.5, ey - uz * 5 + ux * 3.5);
                        c.lineTo(ex - ux * 5 + uz * 3.5, ey - uz * 5 - ux * 3.5);
                        c.closePath(); c.fill();
                    }
                }
            }
            // Scale bar
            c.fillStyle = 'rgba(255,255,255,0.7)';
            c.fillRect(12, canvasHeight - 18, v.s, 3);
            c.font = '10px sans-serif'; c.textAlign = 'left';
            c.fillText('1 m', 12, canvasHeight - 23);
            return off;
        }

        let bgView = { z: 1, x: 0, y: 0 };
        let gestureActive = false;
        function drawBackground() {
            const key = [selectedPreset.id, canvasWidth, canvasHeight, dpr, showContours, viewZoom, viewPanX, viewPanY].join('|');
            if (!bgCanvas || (key !== bgCacheKey && !gestureActive)) {
                bgCanvas = buildBackground();
                bgCacheKey = key;
                bgView = { z: viewZoom, x: viewPanX, y: viewPanY };
            }
            // During a pinch/drag, reuse the cached image scaled to the live view; rebuilt when the gesture ends.
            const r = viewZoom / bgView.z;
            ctx.save();
            ctx.setTransform(r * dpr, 0, 0, r * dpr, (viewPanX - bgView.x * r) * dpr, (viewPanY - bgView.y * r) * dpr);

            if (r !== 1 || viewPanX !== bgView.x || viewPanY !== bgView.y) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore(); }
            ctx.drawImage(bgCanvas, 0, 0, bgCanvas.width / dpr, bgCanvas.height / dpr);
            ctx.restore();

        function renderPuttLine() {
            // SOLVE for aim that sinks the putt
            const solution = getSolution();
            if (!solution) return;
            const sinkPath = solution.sinkPath;
            const naivePath = solution.naivePath;
            
            // Log solution for debugging
            if (window.logSolution) {
                const overrunDist = solution.overrunPath ? 
                    distance(holeMarker, solution.overrunPath[solution.overrunPath.length - 1]) : 0;
                console.log('Aim solution:', {
                    aimOffset: solution.aimOffset.toFixed(2) + 'm ' + solution.offsetDir,
                    aimAngleDeg: (solution.aimAngle * 180 / Math.PI).toFixed(1) + '°',
                    captureSpeed: solution.captureSpeed ? solution.captureSpeed.toFixed(2) + ' m/s' : 'N/A',
                    overrun: overrunDist > 0 ? overrunDist.toFixed(1) + 'm past' : 'die at cup',
                    sinkPathPoints: sinkPath.length
                });
            }
            
            if (solution.missed) {
                ctx.fillStyle = 'rgba(255, 180, 80, 0.95)';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(solution.runsOff ? 'No make at this pace (ball runs off the scanned green)' : 'No make line at this pace', canvasWidth/2, 64);
            }
            if (solution.missed) return; // never draw a line that does not finish in the hole
            if (sinkPath.length < 2) return;
            if (!solution.missed) sinkPath[sinkPath.length - 1] = { x: holeMarker.x, z: holeMarker.z };
            
            const ballScreen = worldToScreen(ballMarker);
            const holeScreen = worldToScreen(holeMarker);
            const aimScreen = worldToScreen(solution.aimPoint);
            
            // Start-aim marker. The colored line is still the track that falls in the cup.
            ctx.setLineDash([10, 6]);
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.85)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(ballScreen.x, ballScreen.y);
            ctx.lineTo(aimScreen.x, aimScreen.y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = 'rgba(100, 200, 255, 0.28)';
            ctx.beginPath();
            ctx.arc(aimScreen.x, aimScreen.y, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.95)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(aimScreen.x, aimScreen.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(100, 200, 255, 1)';
            ctx.fill();

            ctx.fillStyle = 'rgba(100, 200, 255, 1)';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('AIM HERE', aimScreen.x, aimScreen.y - 20);
            if (solution.aimOffset > 0.05) {
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText(`${solution.aimOffset.toFixed(1)}m ${solution.offsetDir}`, aimScreen.x, aimScreen.y + 26);
            }

            // CONSOLE OVERLAY 3A: Draw OVERRUN path first (faded continuation past hole)
            // Shows where ball would end if hole wasn't there - visualizes pace
            if (solution.overrunPath && solution.overrunPath.length > 1) {
                ctx.setLineDash([8, 4]);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                const overrunStart = worldToScreen(solution.overrunPath[0]);
                ctx.moveTo(overrunStart.x, overrunStart.y);
                for (let i = 1; i < solution.overrunPath.length; i++) {
                    const screen = worldToScreen(solution.overrunPath[i]);
                    ctx.lineTo(screen.x, screen.y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Label overrun distance
                const overrunEnd = solution.overrunPath[solution.overrunPath.length - 1];
                const overrunDist = distance(holeMarker, overrunEnd);
                if (overrunDist > 0.3) { // Only label significant overrun
                    const overrunEndScreen = worldToScreen(overrunEnd);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.font = 'bold 9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`+${overrunDist.toFixed(1)}m past`, overrunEndScreen.x, overrunEndScreen.y - 8);
                    
                    // Draw X marker at true stop point
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(overrunEndScreen.x - 6, overrunEndScreen.y - 6);
                    ctx.lineTo(overrunEndScreen.x + 6, overrunEndScreen.y + 6);
                    ctx.moveTo(overrunEndScreen.x + 6, overrunEndScreen.y - 6);
                    ctx.lineTo(overrunEndScreen.x - 6, overrunEndScreen.y + 6);
                    ctx.stroke();
                }
            }
            
            // CONSOLE OVERLAY 3B: Draw the solid SINK path (colored by soft/hard)
            const powerFraction = puttPower / 100;
            
            // Soft = warm colors (red/orange), thicker
            // Hard = cool colors (green/cyan), thinner
            let strokeColor, lineWidth;
            if (powerFraction < 0.33) {
                strokeColor = 'rgba(239, 68, 68, 0.95)'; // Red (soft)
                lineWidth = 5;
            } else if (powerFraction < 0.67) {
                strokeColor = 'rgba(251, 191, 36, 0.95)'; // Yellow (medium)
                lineWidth = 4;
            } else {
                strokeColor = 'rgba(34, 197, 94, 0.95)'; // Green (hard)
                lineWidth = 3;
            }
            
            // Draw shadow for sink path
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = lineWidth + 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(ballScreen.x + 2, ballScreen.y + 2);
            for (let i = 1; i < sinkPath.length; i++) {
                const screen = worldToScreen(sinkPath[i]);
                ctx.lineTo(screen.x + 2, screen.y + 2);
            }
            ctx.stroke();
            
            // Draw outer glow for sink path
            ctx.strokeStyle = strokeColor.replace('0.95', '0.3');
            ctx.lineWidth = lineWidth + 4;
            ctx.beginPath();
            ctx.moveTo(ballScreen.x, ballScreen.y);
            for (let i = 1; i < sinkPath.length; i++) {
                const screen = worldToScreen(sinkPath[i]);
                ctx.lineTo(screen.x, screen.y);
            }
            ctx.stroke();
            
            // Draw main solid sink line
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.moveTo(ballScreen.x, ballScreen.y);
            for (let i = 1; i < sinkPath.length; i++) {
                const screen = worldToScreen(sinkPath[i]);
                ctx.lineTo(screen.x, screen.y);
            }
            ctx.stroke();
            
            // Label "SINK"
            const sinkLabelIdx = Math.floor(sinkPath.length * 0.6);
            if (sinkLabelIdx < sinkPath.length) {
                const sinkLabelScreen = worldToScreen(sinkPath[sinkLabelIdx]);
                ctx.fillStyle = strokeColor;
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                const label = powerFraction < 0.33 ? 'SOFT SINK' : 
                             powerFraction > 0.67 ? 'FIRM SINK' : 'SINK';
                ctx.fillText(label, sinkLabelScreen.x, sinkLabelScreen.y - 10);
            }
            
            // CONSOLE OVERLAY: Speed beads along sink path
            const beadInterval = Math.max(1, Math.floor(sinkPath.length / 15));
            for (let i = 0; i < sinkPath.length; i += beadInterval) {
                const screen = worldToScreen(sinkPath[i]);
                const progress = i / (sinkPath.length - 1);
                
                // Bead size decreases along path (ball slowing)
                const beadSize = 4 - progress * 2;
                
                // Bead color based on soft/hard
                const beadColor = powerFraction < 0.5 ? 
                    `rgba(255, 255, 255, ${0.8 - progress * 0.4})` :
                    `rgba(200, 255, 200, ${0.8 - progress * 0.4})`;
                
                ctx.fillStyle = beadColor;
                ctx.beginPath();
                ctx.arc(screen.x, screen.y, beadSize, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw direction arrows at key points along sink path
            const arrowIndices = [
                Math.floor(sinkPath.length * 0.2),
                Math.floor(sinkPath.length * 0.5),
                Math.floor(sinkPath.length * 0.8)
            ];
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            arrowIndices.forEach(idx => {
                if (idx >= sinkPath.length - 1) return;
                
                const p1 = worldToScreen(sinkPath[idx]);
                const p2 = worldToScreen(sinkPath[idx + 1]);
                
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const angle = Math.atan2(dy, dx);
                
                ctx.save();
                ctx.translate(p1.x, p1.y);
                ctx.rotate(angle);
                
                // Arrow with outline
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(0, -5);
                ctx.lineTo(0, 5);
                ctx.closePath();
                ctx.stroke();
                ctx.fill();
                
                ctx.restore();
            });
        }

        function renderHole(marker) {

        // ============================================
        // SCAN FILE -> HEIGHT MAP (on the phone)
        // ============================================
        // Same steps as the Oct 19 green: gravity up axis, 10 cm cells, median per cell,
        // drop points > 8 cm off the local surface, fill small gaps, mask big holes, smooth.

        var PLY_TYPES = {
            char: 1, int8: 1, uchar: 1, uint8: 1,
            short: 2, int16: 2, ushort: 2, uint16: 2,
            int: 4, int32: 4, uint: 4, uint32: 4,
            float: 4, float32: 4, double: 8, float64: 8
